syntax = "proto3";

package online_market.api.v1;

option go_package = "github.com/SV1Stail/online_market/gen/online_market/v1;marketv1";

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "online_market/v1/common.proto";
import "online_market/v1/order.proto";

service AdminOrderService {
  rpc ListOrders(ListAdminOrdersRequest) returns (ListAdminOrdersResponse);
  rpc GetOrder(GetAdminOrderRequest) returns (GetAdminOrderResponse);
  rpc UpdateOrderDetails(UpdateOrderDetailsRequest) returns (UpdateOrderDetailsResponse);
  rpc AddOrderItem(AddOrderItemRequest) returns (AddOrderItemResponse);
  rpc UpdateOrderItem(UpdateOrderItemRequest) returns (UpdateOrderItemResponse);
  rpc RemoveOrderItem(RemoveOrderItemRequest) returns (RemoveOrderItemResponse);
  rpc ChangeOrderStatus(ChangeOrderStatusRequest) returns (ChangeOrderStatusResponse);
  rpc ListOrderEvents(ListOrderEventsRequest) returns (ListOrderEventsResponse);
  rpc SetDeliveryDayLimit(SetDeliveryDayLimitRequest) returns (SetDeliveryDayLimitResponse);
  rpc CreateDeliveryPlace(CreateDeliveryPlaceRequest) returns (CreateDeliveryPlaceResponse);
  rpc UpdateDeliveryPlace(UpdateDeliveryPlaceRequest) returns (UpdateDeliveryPlaceResponse);
  rpc DeleteDeliveryPlace(DeleteDeliveryPlaceRequest) returns (DeleteDeliveryPlaceResponse);
}

message AdminOrder {
  Order order = 1;
  string internal_comment = 2;
  string assigned_admin_id = 3;
}

message OrderListFilter {
  repeated OrderStatus statuses = 1;
  string query = 2;
  google.protobuf.Timestamp created_from = 3;
  google.protobuf.Timestamp created_to = 4;
  string assigned_admin_id = 5;
}

message ListAdminOrdersRequest {
  OrderListFilter filter = 1;
  PageRequest page = 2;
}

message ListAdminOrdersResponse {
  repeated AdminOrder orders = 1;
  PageResponse page = 2;
}

message GetAdminOrderRequest {
  string order_id = 1;
}

message GetAdminOrderResponse {
  AdminOrder order = 1;
}

message OrderDetailsPatch {
  string name = 1;
  CustomerContact customer = 2;
  DeliveryDetails delivery = 3;
  string customer_comment = 4;
  string internal_comment = 5;
  string assigned_admin_id = 6;
}

message UpdateOrderDetailsRequest {
  string order_id = 1;
  OrderDetailsPatch patch = 2;
  // Paths are relative to OrderDetailsPatch.
  google.protobuf.FieldMask update_mask = 3;
  uint64 expected_version = 4;
}

message UpdateOrderDetailsResponse {
  AdminOrder order = 1;
}

message AddOrderItemRequest {
  string order_id = 1;
  string product_id = 2;
  uint32 quantity = 3;
  // If omitted, the current catalog price is used.
  Money unit_price = 4;
  uint64 expected_version = 5;
}

message AddOrderItemResponse {
  AdminOrder order = 1;
}

message OrderItemPatch {
  string product_name = 1;
  uint32 quantity = 2;
  Money unit_price = 3;
}

message UpdateOrderItemRequest {
  string order_id = 1;
  string item_id = 2;
  OrderItemPatch patch = 3;
  // Paths are relative to OrderItemPatch.
  google.protobuf.FieldMask update_mask = 4;
  uint64 expected_version = 5;
}

message UpdateOrderItemResponse {
  AdminOrder order = 1;
}

message RemoveOrderItemRequest {
  string order_id = 1;
  string item_id = 2;
  uint64 expected_version = 3;
}

message RemoveOrderItemResponse {
  AdminOrder order = 1;
}

message ChangeOrderStatusRequest {
  string order_id = 1;
  OrderStatus status = 2;
  string comment = 3;
  uint64 expected_version = 4;
}

message ChangeOrderStatusResponse {
  AdminOrder order = 1;
}

enum OrderEventType {
  ORDER_EVENT_TYPE_UNSPECIFIED = 0;
  ORDER_EVENT_TYPE_CREATED = 1;
  ORDER_EVENT_TYPE_DETAILS_CHANGED = 2;
  ORDER_EVENT_TYPE_ITEM_ADDED = 3;
  ORDER_EVENT_TYPE_ITEM_CHANGED = 4;
  ORDER_EVENT_TYPE_ITEM_REMOVED = 5;
  ORDER_EVENT_TYPE_STATUS_CHANGED = 6;
}

message OrderFieldChange {
  string field_path = 1;
  string old_value = 2;
  string new_value = 3;
}

message OrderEvent {
  string id = 1;
  string order_id = 2;
  OrderEventType type = 3;
  string actor_admin_id = 4;
  string comment = 5;
  repeated OrderFieldChange changes = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListOrderEventsRequest {
  string order_id = 1;
  PageRequest page = 2;
}

message ListOrderEventsResponse {
  repeated OrderEvent events = 1;
  PageResponse page = 2;
}

message SetDeliveryDayLimitRequest {
  string date = 1;
  // Zero closes the day. The configured default applies only when a day has no saved limit.
  uint32 delivery_limit = 2;
}

message SetDeliveryDayLimitResponse {
  DeliveryDay day = 1;
}

message CreateDeliveryPlaceRequest {
  string name = 1;
  uint32 daily_limit = 2;
  DeliveryScheduleKind schedule_kind = 3;
  repeated string dates = 4;
}

message CreateDeliveryPlaceResponse {
  DeliveryPlace place = 1;
}

message UpdateDeliveryPlaceRequest {
  string place_id = 1;
  string name = 2;
  uint32 daily_limit = 3;
  DeliveryScheduleKind schedule_kind = 4;
  repeated string dates = 5;
}

message UpdateDeliveryPlaceResponse {
  DeliveryPlace place = 1;
}

message DeleteDeliveryPlaceRequest {
  string place_id = 1;
}

message DeleteDeliveryPlaceResponse {}