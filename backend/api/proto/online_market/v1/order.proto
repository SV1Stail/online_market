syntax = "proto3";

package online_market.api.v1;

option go_package = "github.com/SV1Stail/online_market/gen/online_market/v1;marketv1";

import "google/protobuf/timestamp.proto";
import "online_market/v1/common.proto";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListDeliveryPlaces(ListDeliveryPlacesRequest) returns (ListDeliveryPlacesResponse);
  rpc ListDeliveryDays(ListDeliveryDaysRequest) returns (ListDeliveryDaysResponse);
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_NEW = 1;
  ORDER_STATUS_CONFIRMED = 2;
  ORDER_STATUS_ASSEMBLING = 3;
  ORDER_STATUS_READY = 4;
  ORDER_STATUS_IN_DELIVERY = 5;
  ORDER_STATUS_COMPLETED = 6;
  ORDER_STATUS_CANCELLED = 7;
}

enum DeliveryMethod {
  DELIVERY_METHOD_UNSPECIFIED = 0;
  DELIVERY_METHOD_PICKUP = 1;
  DELIVERY_METHOD_COURIER = 2;
}

message CustomerContact {
  string full_name = 1;
  string phone = 2;
  string email = 3;
}

message DeliveryDetails {
  DeliveryMethod method = 1;
  string city = 2;
  string address = 3;
  string comment = 4;
  // Calendar day the customer expects delivery, YYYY-MM-DD in the shop calendar.
  string delivery_date = 5;
}

// DeliveryDay is one shop calendar day and its delivery capacity.
message DeliveryDay {
  string date = 1;
  uint32 booked = 2;
  uint32 delivery_limit = 3;
  // Slots still open. Zero means the day cannot accept another delivery.
  uint32 remaining = 4;
}

// OrderItem is a snapshot. Its name, price, and unit label do not change when
// the catalog product is edited later.
message OrderItem {
  string id = 1;
  string product_id = 2;
  string product_name = 3;
  Money unit_price = 4;
  uint32 quantity = 5;
  Money line_total = 6;
  // Unit label copied from the catalog when the line was added. Empty if none.
  string unit_of_measure = 7;
}

message Order {
  string id = 1;
  string number = 2;
  string name = 3;
  CustomerContact customer = 4;
  DeliveryDetails delivery = 5;
  string customer_comment = 6;
  OrderStatus status = 7;
  repeated OrderItem items = 8;
  Money total = 9;
  uint64 version = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message CreateOrderRequest {
  string cart_id = 1;
  string cart_token = 2;
  CustomerContact customer = 3;
  DeliveryDetails delivery = 4;
  string customer_comment = 5;
  // A unique key generated by a client for one checkout attempt. Repeating a
  // request with this key must not create another order.
  string idempotency_key = 6;
}

message CreateOrderResponse {
  Order order = 1;
  // Required for public order lookup. It is returned only after checkout.
  string order_token = 2;
}

message GetOrderRequest {
  string order_number = 1;
  string order_token = 2;
}

message GetOrderResponse {
  Order order = 1;
}

enum DeliveryScheduleKind {
  DELIVERY_SCHEDULE_KIND_UNSPECIFIED = 0;
  // Every day in the shop horizon.
  DELIVERY_SCHEDULE_KIND_ALL = 1;
  // Monday through Friday in the shop calendar.
  DELIVERY_SCHEDULE_KIND_WEEKDAYS = 2;
  // Only the dates listed on the place.
  DELIVERY_SCHEDULE_KIND_DATES = 3;
}

message DeliveryPlace {
  string id = 1;
  string name = 2;
  uint32 daily_limit = 3;
  DeliveryScheduleKind schedule_kind = 4;
  // YYYY-MM-DD. Used when schedule_kind is DATES.
  repeated string dates = 5;
}

message ListDeliveryPlacesRequest {}

message ListDeliveryPlacesResponse {
  repeated DeliveryPlace places = 1;
}

message ListDeliveryDaysRequest {
  // Inclusive first day, YYYY-MM-DD. Empty starts at the shop's current day.
  string from_date = 1;
  // Number of days to return. Zero uses the server horizon.
  uint32 days = 2;
  // City or settlement the customer wants delivery to.
  string city = 3;
}

message ListDeliveryDaysResponse {
  repeated DeliveryDay days = 1;
}