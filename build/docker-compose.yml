name: online-market-backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: online_market
      POSTGRES_USER: online_market
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U online_market -d online_market"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend/migration:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://online_market:${POSTGRES_PASSWORD}@postgres:5432/online_market?sslmode=disable
      - up
    restart: "no"

  api:
    image: online-market-backend:local
    build:
      context: ..
      dockerfile: backend/build/app/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://online_market:${POSTGRES_PASSWORD}@postgres:5432/online_market?sslmode=disable
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.0.0/24}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      ORDER_TOKEN_SECRET: ${ORDER_TOKEN_SECRET:?ORDER_TOKEN_SECRET is required}
      GRPC_ADDRESS: :8080
      NOTIFICATION_CHANNELS: ${NOTIFICATION_CHANNELS:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - "127.0.0.1:${GRPC_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks:
      - default
      - gateway-api

  grpc-ui:
    image: ${GRPCUI_IMAGE:-ghcr.io/fullstorydev/grpcui:v1.5.4}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../backend/api/proto:/protos:ro
    command:
      - -plaintext
      - -bind=0.0.0.0
      - -port=8080
      - -connect-fail-fast=false
      - -import-path=/protos
      - -proto=/protos/online_market/v1/admin_auth.proto
      - -proto=/protos/online_market/v1/admin_catalog.proto
      - -proto=/protos/online_market/v1/admin_order.proto
      - -proto=/protos/online_market/v1/cart.proto
      - -proto=/protos/online_market/v1/catalog.proto
      - -proto=/protos/online_market/v1/order.proto
      - api:8080
    ports:
      - "127.0.0.1:${GRPCUI_PORT:-8081}:8080"

volumes:
  postgres-data:

networks:
  gateway-api:
    name: online-market-local
    ipam:
      config:
        - subnet: ${GATEWAY_NETWORK_SUBNET:-172.30.0.0/24}

